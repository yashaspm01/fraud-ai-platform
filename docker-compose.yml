services:
  app:
    build: .
    container_name: fraud_ops_app
    network_mode: host
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    container_name: fraud_ops_db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - fraud_ops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud_admin -d fraud_ops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fraud_ops_pgdata:
